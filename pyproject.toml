[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "talantasan", email = "talant.py@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.6",
    "gradio>=6.32.0",
    "ipykernel>=7.4.0",
    "notebook>=7.6.5",
    "openai>=3.45.0",
    "pydantic>=2.14.4",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
agents = "agents:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
